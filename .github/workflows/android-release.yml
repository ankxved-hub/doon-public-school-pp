name: Publish Doon Public School Etah APK Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK 36.1 & Build Verified APK
        env:
          CLOUDFLARE_API_URL: ${{ secrets.CLOUDFLARE_API_URL }}
        run: |
          if [ -n "$CLOUDFLARE_API_URL" ]; then
            echo "CLOUDFLARE_API_URL secret detected (length=${#CLOUDFLARE_API_URL})."
          else
            echo "WARNING: secrets.CLOUDFLARE_API_URL is EMPTY — APK will default to Firebase until connected in app."
          fi

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"

          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          gradle assembleDebug --no-daemon -PCLOUDFLARE_API_URL="$CLOUDFLARE_API_URL"

          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          mkdir -p release
          "$ZIPALIGN" -p -f 4 app/build/outputs/apk/debug/app-debug.apk release/DoonPublicSchool-Etah.apk

          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            release/DoonPublicSchool-Etah.apk

          "$ZIPALIGN" -c -v 4 release/DoonPublicSchool-Etah.apk
          "$APKSIGNER" verify -v --print-certs release/DoonPublicSchool-Etah.apk
          ls -lh release/DoonPublicSchool-Etah.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoonPublicSchool-Etah-APK
          path: release/DoonPublicSchool-Etah.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: "Doon Public School, Etah ERP v1.2.${{ github.run_number }}"
          body: |
            ### Doon Public School, Etah — Official Android App (APK)
            1. Scroll down to **Assets** and tap **`DoonPublicSchool-Etah.apk`** directly (do not download a `.zip` source archive).
            2. If prompted by Chrome/Files, allow **Install unknown apps**.
            3. Built with full **v1 + v2 + v3** APK signatures & 4KB page alignment for Android 7–16 phones.
          files: |
            release/DoonPublicSchool-Etah.apk
          draft: false
          prerelease: false
