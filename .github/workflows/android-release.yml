name: Publish Doon Public School Etah APK Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK Command-Line Tools
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses & Install SDK 36.1
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --update || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || \
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          ls -la "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -s "debug.keystore" ]; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android APK with Gradle
        env:
          CLOUDFLARE_API_URL: ${{ secrets.CLOUDFLARE_API_URL }}
        run: |
          if [ -n "$CLOUDFLARE_API_URL" ]; then
            echo "CLOUDFLARE_API_URL secret detected (length=${#CLOUDFLARE_API_URL})."
          else
            echo "WARNING: secrets.CLOUDFLARE_API_URL is EMPTY — APK will allow connecting Cloudflare URL inside the app."
          fi

          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace -PCLOUDFLARE_API_URL="$CLOUDFLARE_API_URL"

      - name: Align, Sign & Verify APK
        run: |
          RAW_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$RAW_APK" ]; then
            echo "ERROR: Expected built APK not found at $RAW_APK"
            exit 1
          fi

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/36.0.0"
          if [ ! -x "$BUILD_TOOLS_DIR/zipalign" ]; then
            BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          fi
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          mkdir -p release
          "$ZIPALIGN" -p -f 4 "$RAW_APK" release/DoonPublicSchool-Etah.apk
          "$ZIPALIGN" -c -v 4 release/DoonPublicSchool-Etah.apk

          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            release/DoonPublicSchool-Etah.apk

          "$APKSIGNER" verify -v --print-certs release/DoonPublicSchool-Etah.apk
          ls -lh release/DoonPublicSchool-Etah.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoonPublicSchool-Etah-APK
          path: release/DoonPublicSchool-Etah.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.2.${{ github.run_number }}.${{ github.run_attempt }}
          name: "Doon Public School, Etah ERP v1.2.${{ github.run_number }}"
          body: |
            ### Doon Public School, Etah — Official Android App (APK)
            1. Scroll down to **Assets** and tap **`DoonPublicSchool-Etah.apk`** directly (do not download a `.zip` source archive).
            2. If prompted by Chrome/Files, allow **Install unknown apps**.
            3. Built with full **v1 + v2 + v3** APK signatures & 4KB page alignment for Android 7–16 phones.
          files: release/DoonPublicSchool-Etah.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
