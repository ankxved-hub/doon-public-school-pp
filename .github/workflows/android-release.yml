name: Build & Release Doon Public School Etah APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Keystores for Debug & Release Signing
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -storepass dpsEtahRelease123 -alias upload -keypass dpsEtahRelease123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Doon Public School Etah,O=DPS Etah,C=IN"
          fi

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: dpsEtahRelease123
          KEY_PASSWORD: dpsEtahRelease123
        run: |
          gradle assembleDebug assembleRelease --no-daemon

      - name: Rename APK files for Release
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/DoonPublicSchool-Etah-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-apks/DoonPublicSchool-Etah-release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoonPublicSchool-Etah-APKs
          path: release-apks/*.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Doon Public School, Etah ERP v1.0.${{ github.run_number }}"
          body: |
            Official Android APK release for **Doon Public School, Etah**.
            - Download **`DoonPublicSchool-Etah-release.apk`** or **`DoonPublicSchool-Etah-debug.apk`** below and install on your Android phone.
            - Note: Since Google Sign-In is tied to your Firebase project's SHA-1 certificate, use the APK generated directly from AI Studio's **Export / Generate APK** menu or add your GitHub keystore SHA-1 in Firebase Console if using Google Sign-In.
          files: |
            release-apks/DoonPublicSchool-Etah-release.apk
            release-apks/DoonPublicSchool-Etah-debug.apk
          draft: false
          prerelease: false
