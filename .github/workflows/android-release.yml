name: Publish Doon Public School Etah APK Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK if not pre-bundled in release/
        if: ${{ !hashFiles('release/DoonPublicSchool-Etah.apk') }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1 (if building from source)
        if: ${{ !hashFiles('release/DoonPublicSchool-Etah.apk') }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK 36.1 & Build APK (if not pre-bundled)
        if: ${{ !hashFiles('release/DoonPublicSchool-Etah.apk') }}
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          gradle assembleDebug --no-daemon
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/DoonPublicSchool-Etah.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoonPublicSchool-Etah-APK
          path: release/DoonPublicSchool-Etah.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Doon Public School, Etah ERP v1.0.${{ github.run_number }}"
          body: |
            ### Doon Public School, Etah — Official Android App (APK)
            Download **`DoonPublicSchool-Etah.apk`** below under **Assets** and install it on any Android phone.
            - Includes real-time Firebase Cloud Sync, Stay-Signed-In Role Login, Principal/Teacher/Fee Manager/Student Portals, and Craft & Science Project Showcase.
          files: |
            release/DoonPublicSchool-Etah.apk
          draft: false
          prerelease: false
