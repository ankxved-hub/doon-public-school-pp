name: Publish Doon Public School Etah APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare Android SDK 36.1 & Licenses
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          if [ ! -w "$SDK_ROOT" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT" 2>/dev/null || true
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "cmdline-tools not found under $SDK_ROOT — downloading official Google Android command-line tools..."
            TMP_ZIP="/tmp/android-cmdline-tools.zip"
            TMP_DIR="/tmp/android-cmdline-extract"
            rm -rf "$TMP_ZIP" "$TMP_DIR"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$TMP_ZIP"
            unzip -q "$TMP_ZIP" -d "$TMP_DIR"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$TMP_DIR/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            chmod +x "$SDK_ROOT/cmdline-tools/latest/bin/"*
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          # Append (never overwrite) standard & preview license hashes so runner pre-accepted hashes stay intact
          mkdir -p "$SDK_ROOT/licenses"
          touch "$SDK_ROOT/licenses/android-sdk-license" "$SDK_ROOT/licenses/android-sdk-preview-license"
          cat <<'EOF' >> "$SDK_ROOT/licenses/android-sdk-license"
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF
          sort -u -o "$SDK_ROOT/licenses/android-sdk-license" "$SDK_ROOT/licenses/android-sdk-license"

          cat <<'EOF' >> "$SDK_ROOT/licenses/android-sdk-preview-license"
          84831b9409646a918e30573bab4c9c91346d8abd
          EOF
          sort -u -o "$SDK_ROOT/licenses/android-sdk-preview-license" "$SDK_ROOT/licenses/android-sdk-preview-license"

          accept_licenses() {
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=3 --licenses >/dev/null 2>&1 || true
            set -o pipefail
          }

          accept_licenses

          # Upgrade cmdline-tools so sdkmanager recognizes minor API levels like android-36.1
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "cmdline-tools;latest" || true
          NEW_SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$NEW_SDKMANAGER" ] && [ -x "$NEW_SDKMANAGER" ]; then
            SDKMANAGER="$NEW_SDKMANAGER"
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          accept_licenses

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "build-tools;36.0.0"

          # Pre-install Android SDK 36.1 across stable/beta/canary channels (AGP 9.1.1 also auto-downloads if needed)
          if [ ! -d "$SDK_ROOT/platforms/android-36.1" ]; then
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36.1" || \
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=1 --install "platforms;android-36.1" || \
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=3 --install "platforms;android-36.1" || \
              echo "::notice::platforms;android-36.1 not pre-installed via sdkmanager; AGP 9.1.1 will auto-download it during Gradle."
          fi

          accept_licenses

          echo "=== Installed SDK Platforms, Build Tools & Licenses ==="
          ls -la "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools" "$SDK_ROOT/licenses" || true

      - name: Normalize & Verify Cloudflare Worker URL Secret
        shell: bash
        env:
          RAW_CF_URL: ${{ secrets.CLOUDFLARE_API_URL }}
        run: |
          set -euo pipefail

          CLEAN_CF_URL="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          raw = (os.environ.get("RAW_CF_URL") or "").strip().strip('"').strip("'").strip()
          if not raw:
              print("")
              raise SystemExit(0)
          if not raw.lower().startswith(("http://", "https://")):
              raw = "https://" + raw
          parsed = urlparse(raw)
          if not parsed.netloc:
              print("")
              raise SystemExit(0)
          scheme = parsed.scheme.lower()
          host = parsed.netloc.strip()
          print(f"{scheme}://{host}")
          PY
          )"

          echo "CLEAN_CLOUDFLARE_API_URL=$CLEAN_CF_URL" >> "$GITHUB_ENV"

          if [ -n "$CLEAN_CF_URL" ]; then
            CF_HOST="$(python3 -c 'import sys; from urllib.parse import urlparse; print(urlparse(sys.argv[1]).hostname or "")' "$CLEAN_CF_URL")"
            echo "CLOUDFLARE_API_URL secret normalized cleanly (host=$CF_HOST)."
            if curl -fsS --max-time 10 "$CLEAN_CF_URL/api/bootstrap/status" >/dev/null 2>&1; then
              echo "Cloudflare Worker health check PASSED (/api/bootstrap/status reachable)."
            else
              echo "::warning::Could not reach $CLEAN_CF_URL/api/bootstrap/status during CI probe; URL will still be compiled into the APK."
            fi
          else
            echo "::warning::secrets.CLOUDFLARE_API_URL is empty or invalid — APK will show the Cloudflare Server Setup screen on first launch."
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode & Verify Signing Keystore
        shell: bash
        run: |
          set -euo pipefail

          # Ensure .env.example exists for secrets-gradle-plugin even if dotfiles were omitted on export
          if [ ! -f ".env.example" ]; then
            echo "CLOUDFLARE_API_URL=" > .env.example
          fi

          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "WARNING: debug.keystore.base64 missing; generating fallback debug.keystore"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "ERROR: debug.keystore is empty or failed to decode."
            exit 1
          fi

          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Build Android APK (Gradle --no-daemon)
        shell: bash
        env:
          CLOUDFLARE_API_URL: ${{ env.CLEAN_CLOUDFLARE_API_URL }}
        run: |
          set -euo pipefail

          set +e
          gradle assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            -Dorg.gradle.daemon=false \
            -Pandroid.builder.sdkDownload=true \
            -PCLOUDFLARE_API_URL="$CLOUDFLARE_API_URL" \
            2>&1 | tee /tmp/gradle-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "========================================================"
            echo "EXACT GRADLE FAILURE SUMMARY (READ THIS)"
            echo "========================================================"
            SUMMARY="$(awk '
              /^> Task .* FAILED/ { print }
              /^e: / { print }
              /^FAILURE:/ { show=1 }
              show { print }
            ' /tmp/gradle-build.log | head -n 45)"
            echo "$SUMMARY"
            echo "========================================================"
            {
              echo "### Gradle APK Build Failure Summary"
              echo '```text'
              echo "$SUMMARY"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$BUILD_EXIT"
          fi

      - name: Upload Gradle Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: Align, Sign (v1/v2/v3) & Validate APK Package
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          RAW_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$RAW_APK" ]; then
            echo "ERROR: Built APK not found or empty at $RAW_APK"
            exit 1
          fi

          BUILD_TOOLS_DIR="$SDK_ROOT/build-tools/36.0.0"
          if [ ! -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          fi
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"

          rm -rf release /tmp/dps-aligned.apk
          mkdir -p release

          if ! "$ZIPALIGN" -P 16 -f 4 "$RAW_APK" /tmp/dps-aligned.apk 2>/dev/null; then
            "$ZIPALIGN" -p -f 4 "$RAW_APK" /tmp/dps-aligned.apk
          fi
          "$ZIPALIGN" -c -v 4 /tmp/dps-aligned.apk

          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --min-sdk-version 24 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out release/DoonPublicSchool-Etah.apk \
            /tmp/dps-aligned.apk

          "$APKSIGNER" verify -v --print-certs release/DoonPublicSchool-Etah.apk
          if [ -x "$AAPT2" ]; then
            "$AAPT2" dump badging release/DoonPublicSchool-Etah.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label):" || true
          fi
          ls -lh release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoonPublicSchool-Etah-APK
          path: release/DoonPublicSchool-Etah.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.2.${{ github.run_number }}.${{ github.run_attempt }}
          name: "Doon Public School, Etah ERP v1.2.${{ github.run_number }}"
          body: |
            ### Doon Public School, Etah — Official Android App (APK)
            1. Scroll down to **Assets** and tap **`DoonPublicSchool-Etah.apk`** directly (do not download Source code `.zip`).
            2. If you previously installed an APK with a different signing certificate, uninstall the old app once before installing this release.
            3. Allow **Install unknown apps** if prompted by Android / Chrome / Files.
            4. Verified with 16KB/4KB zipalign + explicit **v1 + v2 + v3** `apksigner` signatures (`minSdk 24`–`targetSdk 36`).
          files: release/DoonPublicSchool-Etah.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
