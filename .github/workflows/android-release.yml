name: Publish Doon Public School Etah APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK Command-Line Tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36.1 / 36 & Build Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses --sdk_root="$SDK_ROOT" >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "cmdline-tools;latest" >/dev/null 2>&1 || true
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --licenses --sdk_root="$SDK_ROOT" >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "build-tools;36.0.0"

          if ! "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36.1"; then
            echo "platforms;android-36.1 unavailable in sdkmanager — installing stable platforms;android-36"
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36"
          fi

          echo "=== Installed SDK Platforms & Build Tools ==="
          ls -la "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode & Verify Signing Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "WARNING: debug.keystore.base64 missing; generating fallback debug.keystore"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "ERROR: debug.keystore is empty or failed to decode"
            exit 1
          fi

          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Build Android APK with Gradle
        env:
          CLOUDFLARE_API_URL: ${{ secrets.CLOUDFLARE_API_URL }}
        run: |
          if [ -n "$CLOUDFLARE_API_URL" ]; then
            echo "CLOUDFLARE_API_URL secret detected (length=${#CLOUDFLARE_API_URL})."
          else
            echo "WARNING: secrets.CLOUDFLARE_API_URL is EMPTY — APK will allow connecting Cloudflare URL inside the app."
          fi

          gradle assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -PCLOUDFLARE_API_URL="$CLOUDFLARE_API_URL"

      - name: Align, Sign & Validate APK Package
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          RAW_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$RAW_APK" ]; then
            echo "ERROR: Built APK not found or empty at $RAW_APK"
            exit 1
          fi

          BUILD_TOOLS_DIR="$SDK_ROOT/build-tools/36.0.0"
          if [ ! -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          fi
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"

          rm -rf release
          mkdir -p release

          "$ZIPALIGN" -p -f 4 "$RAW_APK" /tmp/dps-aligned.apk
          "$ZIPALIGN" -c -v 4 /tmp/dps-aligned.apk

          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --min-sdk-version 24 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out release/DoonPublicSchool-Etah.apk \
            /tmp/dps-aligned.apk

          "$APKSIGNER" verify -v --print-certs release/DoonPublicSchool-Etah.apk
          if [ -x "$AAPT2" ]; then
            "$AAPT2" dump badging release/DoonPublicSchool-Etah.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label):" || true
          fi
          ls -lh release/DoonPublicSchool-Etah.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoonPublicSchool-Etah-APK
          path: release/DoonPublicSchool-Etah.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.2.${{ github.run_number }}.${{ github.run_attempt }}
          name: "Doon Public School, Etah ERP v1.2.${{ github.run_number }}"
          body: |
            ### Doon Public School, Etah — Official Android App (APK)
            1. Scroll down to **Assets** and tap **`DoonPublicSchool-Etah.apk`** directly (do not download Source code `.zip`).
            2. If you previously installed an APK with a different signing certificate, uninstall the old app once before installing this release.
            3. Allow **Install unknown apps** if prompted by Android / Chrome / Files.
            4. Verified with 4KB/page zipalign + full **v1 + v2 + v3** APK signatures (`minSdk 24`–`targetSdk 36`).
          files: release/DoonPublicSchool-Etah.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
